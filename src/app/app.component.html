<div
	class="studio"
	[class.is-composing]="phase !== 'live'"
	[class.menu-open]="menuOpen"
	appTheme
	#studioRoot
>
	<div class="studio-grid"></div>
	<div class="studio-vignette"></div>
	<img class="studio-watermark" src="assets/logo.png" alt="" aria-hidden="true">
	<canvas class="studio-trails" #trailCanvas></canvas>
	<div class="studio-overlay" #overlay></div>

	<div class="boot-mark" [class.is-hidden]="phase !== 'orbit' && phase !== 'boot'">
		<div class="ring">
			<b>{{ 'studio.composing' | translate }}</b>
		</div>
	</div>

	<div class="mobile-bar">
		<img src="assets/profile.jpeg" alt="D. Berat KARATAŞ" width="40" height="40">
		<strong>D. Berat KARATAŞ</strong>
		<button type="button" class="icon-btn hamburger" [attr.aria-label]="'studio.menu' | translate" (click)="toggleMenu()">
			<span></span>
			<span></span>
			<span></span>
		</button>
	</div>

	<div class="menu-backdrop" *ngIf="menuOpen" (click)="menuOpen = false"></div>

	<div class="studio-shell">
		<aside class="sidebar" [class.is-open]="menuOpen">
			<div class="frame sidebar-card px-5 pb-5 pt-7" data-sketch data-intro="nav" style="--dot: #FF6B9D">
				<div class="flex flex-col items-center text-center">
					<img
						src="assets/profile.jpeg"
						alt="D. Berat KARATAŞ"
						width="92"
						height="92"
						class="h-[92px] w-[92px] rounded-full object-cover"
					>
					<a class="mt-3 font-display text-sm font-semibold tracking-wide text-[var(--primary)]" href="assets/cv-{{i18n.lang}}.pdf" target="_blank">CV</a>
				</div>

				<div class="mt-5 flex items-center justify-center gap-2 text-xs font-semibold">
					<button type="button" class="lang-option" [class.opacity-100]="i18n.lang === 'tr'" [class.opacity-40]="i18n.lang !== 'tr'" (click)="setLang('tr')">TR</button>
					<span class="opacity-40">/</span>
					<button type="button" class="lang-option" [class.opacity-100]="i18n.lang === 'en'" [class.opacity-40]="i18n.lang !== 'en'" (click)="setLang('en')">EN</button>
				</div>

				<nav class="mt-5 flex flex-col gap-1">
					<button type="button" class="nav-btn" [class.is-active]="activeSection === 'about'" (click)="scrollTo('about')">{{ 'nav.home' | translate }}</button>
					<button type="button" class="nav-btn" [class.is-active]="activeSection === 'projects'" (click)="scrollTo('projects')">{{ 'nav.projects' | translate }}</button>
					<button type="button" class="nav-btn" [class.is-active]="activeSection === 'internships'" (click)="scrollTo('internships')">{{ 'nav.internships' | translate }}</button>
					<button type="button" class="nav-btn" [class.is-active]="activeSection === 'hobbies'" (click)="scrollTo('hobbies')">{{ 'nav.hobbies' | translate }}</button>
				</nav>

				<div class="mt-5 flex items-center justify-center gap-2">
					<button class="icon-btn" type="button" title="GitHub" (click)="openWebsite('https://github.com/BeratKARATAS53')">
						<img src="assets/icons/github.png" alt="github">
					</button>
					<button class="icon-btn" type="button" title="LinkedIn" (click)="openWebsite('https://www.linkedin.com/in/berat-karatas/')">
						<img src="assets/icons/linkedin.png" alt="linkedin">
					</button>
					<button class="icon-btn" type="button" [title]="activeTheme === 'light' ? ('theme.light' | translate) : ('theme.dark' | translate)" (click)="toggleTheme()">
						<img [src]="'assets/icons/' + activeTheme + '-icon.png'" alt="theme">
					</button>
				</div>
			</div>

			<div class="frame tech-rail mt-4 px-4 py-5" data-sketch data-intro="tech" style="--dot: #7B8CFF">
				<div class="mb-3 flex items-center justify-center gap-2">
					<img src="assets/logo.png" width="28" alt="logo" [title]="'logoTitle' | translate">
					<h2 class="font-display text-sm leading-tight" data-type-ink [attr.data-full]="'sections.technologies' | translate"></h2>
				</div>
				<button class="tech-pill text-[var(--angular)]" type="button" (click)="openWebsite('https://angular.io/')">Angular</button>
				<button class="tech-pill text-[var(--mongo)]" type="button" (click)="openWebsite('https://nestjs.com/')">NestJS</button>
				<button class="tech-pill text-[var(--mongo)]" type="button" (click)="openWebsite('https://www.mongodb.com/')">MongoDB</button>
				<button class="tech-pill text-[var(--primary)]" type="button" (click)="openWebsite('https://laravel.com/')">Laravel</button>
				<button class="tech-pill text-[var(--github)]" type="button" (click)="openWebsite('https://github.com/')">GitHub</button>
				<button class="tech-pill text-[var(--angular)]" type="button" (click)="openWebsite('https://figma.com/')">Figma</button>
				<button class="tech-pill text-purple-300" type="button" (click)="openWebsite('https://ubuntu.com/')">Ubuntu</button>
				<div class="agent-dock" data-agent-dock></div>
			</div>
		</aside>

		<div class="main-col">
			<header class="flex flex-wrap gap-2" data-sketch data-intro="top" style="--dot: #5CE1E6">
				<span class="chip" style="--chip: #5CE1E6">
					<img src="assets/icons/man.png" alt="">
					<span data-type-ink data-full="D. Berat KARATAŞ"></span>
				</span>
				<span class="chip" style="--chip: #C8F542">
					<img src="assets/icons/software-engineer.png" alt="">
					<span data-type-ink [attr.data-full]="'role' | translate"></span>
				</span>
				<a class="chip" style="--chip: #FF6B9D" href="mailto:007berat.karatas@gmail.com" [title]="'sendEmail' | translate">
					<img src="assets/icons/message.png" alt="">
					<span data-type-ink [attr.data-full]="'007berat.karatas@gmail.com'"></span>
				</a>
				<span class="chip" style="--chip: #FFB347">
					<img src="assets/icons/placeholder.png" alt="">
					<span data-type-ink [attr.data-full]="'location' | translate"></span>
				</span>
			</header>

			<section id="about" class="frame min-h-[280px] px-6 py-7 md:px-8" data-sketch data-intro="hero" style="--dot: #C8F542">
				<p class="mb-2 text-sm opacity-70 type-caret" data-type-ink [attr.data-full]="'role' | translate"></p>
				<h1 class="font-display text-4xl font-semibold tracking-tight md:text-6xl type-caret" data-type-ink data-full="D. Berat KARATAŞ"></h1>
				<p class="mt-5 text-[15px] leading-7 type-caret" data-type-ink [attr.data-full]="content.summary"></p>
			</section>

			<section id="education">
				<h2 class="mb-4 font-display text-xl" data-sketch data-type-ink [attr.data-full]="'sections.education' | translate"></h2>
				<div class="flex flex-col gap-3">
					<div
						class="frame px-5 py-5"
						data-sketch
						[attr.data-intro]="i === 0 ? 'card' : null"
						*ngFor="let item of content.education; let i = index"
						style="--dot: #FFB347"
					>
						<div class="title text-[15px] font-medium">
							<span class="text-[var(--primary)] type-caret" data-type-ink [attr.data-full]="item.school"></span>
							<span data-type-ink [attr.data-full]="' ' + item.location + ' / ' + item.period"></span>
						</div>
						<div class="mt-1 text-[13px] text-[var(--text-inline)]" *ngIf="item.degree" data-type-ink [attr.data-full]="item.degree"></div>
						<div class="mt-1 text-sm" data-type-ink [attr.data-full]="('gpa' | translate) + ' ' + item.gpa"></div>
					</div>
				</div>
			</section>

			<section id="work">
				<h2 class="mb-4 font-display text-xl" data-sketch data-type-ink [attr.data-full]="'sections.work' | translate"></h2>
				<div class="frame px-5 py-5" data-sketch *ngFor="let item of content.work" style="--dot: #5CE1E6">
					<div class="title text-[15px] font-medium">
						<span class="text-[var(--primary)] type-caret" data-type-ink [attr.data-full]="item.company"></span>
						<span data-type-ink [attr.data-full]="' ' + item.location + ' / ' + item.period"></span>
					</div>
					<div class="mt-1 text-[13px] text-[var(--text-inline)]" data-type-ink [attr.data-full]="item.role"></div>
					<p class="mt-3 text-sm leading-6" data-type-ink [attr.data-full]="item.description + (item.descriptionAfter ? ' ' + (item.descriptionLink || '') + item.descriptionAfter : '')"></p>
				</div>
			</section>

			<section id="projects">
				<h2 class="mb-4 font-display text-xl" data-sketch data-type-ink [attr.data-full]="'sections.projects' | translate"></h2>
				<div class="flex flex-col gap-3">
					<article class="frame px-5 py-5" data-sketch *ngFor="let project of content.projects" style="--dot: #7B8CFF">
						<div class="header mb-2 flex items-center gap-3" *ngIf="project.thumb; else projectTitleOnly">
							<div class="project-thumb" (click)="openImage(project.thumb!)">
								<img [src]="project.thumb" [alt]="project.alt">
							</div>
							<div>
								<div class="title text-[15px] font-medium">
									<span class="text-[var(--primary)] type-caret" data-type-ink [attr.data-full]="project.title"></span>
									<span data-type-ink [attr.data-full]="' / ' + project.period"></span>
								</div>
								<div class="text-[13px] text-[var(--text-inline)]" data-type-ink [attr.data-full]="project.stack"></div>
							</div>
						</div>
						<ng-template #projectTitleOnly>
							<div class="title text-[15px] font-medium">
								<span class="text-[var(--primary)] type-caret" data-type-ink [attr.data-full]="project.title"></span>
								<span data-type-ink [attr.data-full]="' / ' + project.period"></span>
							</div>
							<div class="text-[13px] text-[var(--text-inline)]" data-type-ink [attr.data-full]="project.stack"></div>
						</ng-template>
						<p class="mt-2 text-sm leading-6" data-type-ink data-type-html [attr.data-full]="project.description"></p>
					</article>
				</div>
			</section>

			<section id="internships">
				<h2 class="mb-4 font-display text-xl" data-sketch data-type-ink [attr.data-full]="'sections.internships' | translate"></h2>
				<div class="flex flex-col gap-3">
					<article class="frame px-5 py-5" data-sketch *ngFor="let item of content.internships" style="--dot: #FF6B9D">
						<div class="title text-[15px] font-medium">
							<span class="text-[var(--primary)] type-caret" data-type-ink [attr.data-full]="item.company"></span>
							<span data-type-ink [attr.data-full]="' ' + item.location + ' / ' + item.period"></span>
						</div>
						<div class="mt-1 text-[13px] text-[var(--text-inline)]" data-type-ink [attr.data-full]="item.role"></div>
						<p class="mt-3 text-sm leading-6" data-type-ink [attr.data-full]="item.description"></p>
					</article>
				</div>
			</section>

			<section id="hobbies">
				<h2 class="mb-4 font-display text-xl" data-sketch data-type-ink [attr.data-full]="'sections.hobbies' | translate"></h2>
				<div class="palette-grid">
					<div
						*ngFor="let drawing of content.drawings"
						class="palette-piece"
						[ngClass]="drawing.className"
						data-sketch
						data-palette
					>
						<img [src]="drawing.src" [alt]="drawing.alt" loading="lazy" (click)="openImage(drawing.src)">
					</div>
				</div>
			</section>
		</div>
	</div>
</div>

<dialog id="imageModal" class="image-modal" (click)="closeModal()">
	<div class="modal-content relative" (click)="$event.stopPropagation()">
		<span class="close-btn" (click)="closeModal()">&times;</span>
		<img *ngIf="selectedImage" [src]="selectedImage" alt="Selected image">
	</div>
</dialog>
